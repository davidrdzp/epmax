<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Coco A Gogo Hair Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Playfair Display"', 'serif'],
          },
          colors: {
            cream: { 50: '#fffaf7', 100: '#fbf3ec', 200: '#f4e8dc' },
            mauve: { 50: '#f8f1f4', 100: '#efe0e6', 200: '#dfc3cf', 300: '#c9a0b2', 400: '#b07d94', 500: '#966079', 600: '#7a4b61', 700: '#5f3b4c' },
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen font-sans text-mauve-700 bg-gradient-to-br from-rose-100 via-cream-50 to-rose-200 flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Decoración de fondo -->
  <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-rose-200/60 blur-3xl"></div>
  <div class="absolute -bottom-32 -right-24 w-[28rem] h-[28rem] rounded-full bg-mauve-200/50 blur-3xl"></div>

  <main class="relative w-full max-w-md">
    <div class="bg-white/95 backdrop-blur rounded-3xl shadow-md border border-rose-100 p-8 sm:p-10">

      <!-- Marca -->
      <div class="text-center mb-8">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-br from-rose-200 to-rose-400 flex items-center justify-center shadow-sm mb-5">
          <i data-lucide="scissors" class="w-7 h-7 text-white"></i>
        </div>
        <h1 class="font-display text-3xl font-semibold text-mauve-700 leading-tight">Coco A Gogo</h1>
        <p class="font-display italic text-xl text-rose-400 -mt-0.5">Hair Studio</p>
        <p class="text-sm text-mauve-400 mt-3">Ingresa tus credenciales para acceder al sistema.</p>
      </div>

      <!-- Mensajes -->
      {% if error %}
      <div class="mb-5 flex items-start gap-3 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-600" role="alert">
        <i data-lucide="circle-alert" class="w-5 h-5 shrink-0 mt-px"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}
      {% set avisos %}{% include '_flash.html' %}{% endset %}
      {% if avisos|trim %}<div class="mb-5">{{ avisos }}</div>{% endif %}

      <!-- Formulario -->
      <form method="post" action="{{ url_for('login') }}" class="space-y-5">
        <div>
          <label for="correo_us" class="block text-sm font-medium text-mauve-600 mb-1.5">
            Correo electrónico
          </label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-rose-300 absolute left-4 top-1/2 -translate-y-1/2"></i>
            <input id="correo_us" name="correo_us" type="email" autocomplete="off" placeholder="ejemplo@correo.com" required value="{{ correo_us|default('') }}"
              class="w-full pl-11 pr-4 py-3 rounded-2xl bg-cream-50 border border-rose-200 placeholder-mauve-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-rose-300 transition" />
          </div>
        </div>

        <div>
          <label for="contra_us" class="block text-sm font-medium text-mauve-600 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-rose-300 absolute left-4 top-1/2 -translate-y-1/2"></i>
            <input id="contra_us" name="contra_us" type="password" autocomplete="off" placeholder="••••••••" required
              class="w-full pl-11 pr-12 py-3 rounded-2xl bg-cream-50 border border-rose-200 placeholder-mauve-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-rose-300 transition" />
            <button type="button" id="togglePass" class="absolute right-4 top-1/2 -translate-y-1/2 text-mauve-300 hover:text-rose-400 transition" aria-label="Mostrar contraseña">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-400 to-pink-500 text-white font-semibold shadow-md hover:shadow-lg hover:from-rose-500 hover:to-pink-600 active:scale-[.98] transition flex items-center justify-center gap-2">
          Iniciar Sesión
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <p class="text-center text-xs text-mauve-300 mt-8">© 2026 Coco A Gogo Hair Studio</p>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // Mostrar / ocultar contraseña
    const pass = document.getElementById('contra_us');
    document.getElementById('togglePass').addEventListener('click', function () {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      this.innerHTML = '<i data-lucide="' + (show ? 'eye-off' : 'eye') + '" class="w-4 h-4"></i>';
      lucide.createIcons();
    });
  </script>
</body>
</html>
